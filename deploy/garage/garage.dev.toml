# Local development Garage (S3-compatible object storage) configuration.
# Dev-only, non-secret values: this mirrors the postgres alt/alt dev credentials
# and is never used in production, where R2 (or a real Garage) is configured via
# environment/secret injection instead.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "dev-garage-admin-token"
