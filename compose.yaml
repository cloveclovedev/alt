name: alt

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alt
      POSTGRES_USER: alt
      POSTGRES_PASSWORD: alt
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alt -d alt"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [alt]

  migrate:
    image: arigaio/atlas:1.2.0
    command:
      - migrate
      - apply
      - --dir
      - file:///migrations
      - --url
      - postgres://alt:alt@postgres:5432/alt?sslmode=disable
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [alt]

  web:
    build: ./backend
    image: alt:local
    command: ["web"]
    restart: unless-stopped
    environment:
      APP_ENV: local
      PORT: 8080
      LOG_LEVEL: info
      DATABASE_URL: postgres://alt:alt@postgres:5432/alt?sslmode=disable
      ALT_USER_TIMEZONE: Asia/Tokyo
    ports:
      - "127.0.0.1:${ALT_WEB_HOST_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/alt", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [alt]

  schema-dev:
    image: postgres:17-alpine
    profiles: ["tools"]
    environment:
      POSTGRES_DB: alt_schema_dev
      POSTGRES_USER: alt
      POSTGRES_PASSWORD: alt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alt -d alt_schema_dev"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks: [alt]

  atlas:
    image: arigaio/atlas:1.2.0
    profiles: ["tools"]
    volumes:
      - ./db:/db
    depends_on:
      schema-dev:
        condition: service_healthy
    networks: [alt]

volumes:
  postgres-data:

networks:
  alt:
